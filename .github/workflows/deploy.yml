name: Sync blog to Replit

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Replit sync via webhook
        run: |
          PAYLOAD='{"ref":"refs/heads/main","commits":[]}'
          SIGNATURE=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "${{ secrets.REPLIT_WEBHOOK_SECRET }}" | awk '{print "sha256=" $2}')
          curl --fail --silent --show-error -X POST \
            -H "Content-Type: application/json" \
            -H "X-Hub-Signature-256: $SIGNATURE" \
            -H "X-GitHub-Event: push" \
            -d "$PAYLOAD" \
            "${{ secrets.REPLIT_WEBHOOK_URL }}/api/github-webhook"
