<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Jobs Done Labs | Recover $30K in 90 Days with Custom Automation Systems</title>
<meta name="description" content="We guarantee service, logistics & manufacturing businesses recover at least $30,000 in net profit within 90 days by building custom AI automation systems—or you pay nothing. Book your free audit." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&family=Anton&family=Caveat:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="page.css" />
<style>
  html{scroll-behavior:smooth}
  body{margin:0;background:#F4EFE3}
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="brand.jsx"></script>
<script type="text/babel" src="lp-parts1.jsx"></script>
<script type="text/babel" src="lp-parts2.jsx"></script>
<script type="text/babel" src="lp-parts3.jsx"></script>

<script type="text/babel">
  const CALENDLY = "https://calendly.com/ryne-bandolik";

  function BookingModal({ open, onClose }) {
    React.useEffect(() => {
      if (!open) return;
      const onKey = (e) => { if (e.key === "Escape") onClose(); };
      document.addEventListener("keydown", onKey);
      document.body.style.overflow = "hidden";
      return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
    }, [open, onClose]);
    if (!open) return null;
    return (
      <div className="bk-overlay" onClick={onClose}>
        <div className="bk-modal" onClick={(e) => e.stopPropagation()}>
          <button className="bk-close" aria-label="Close" onClick={onClose}>×</button>
          <iframe src={CALENDLY + "?hide_gdpr_banner=1&background_color=0b0d12&text_color=f4efe3&primary_color=1466ff"} title="Book a call with Ryne Bandolik"></iframe>
        </div>
      </div>
    );
  }

  function Page() {
    const [booking, setBooking] = React.useState(false);
    React.useEffect(() => {
      const onClick = (e) => {
        const el = e.target.closest('a[href="#book"]');
        if (el) { e.preventDefault(); setBooking(true); }
      };
      document.addEventListener("click", onClick);
      return () => document.removeEventListener("click", onClick);
    }, []);
    return (
      <div className="lp">
        <LPNav />
        <Hero />
        <TrustStrip />
        <Problem />
        <Industries />
        <FSO />
        <InlineCTA />
        <Services />
        <Process />
        <Results />
        <Comparison />
        <Guarantee />
        <Fit />
        <Testimonials />
        <FAQ />
        <FinalCTA />
        <Footer />
        <BookingModal open={booking} onClose={() => setBooking(false)} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Page />);
</script>
</body>
</html>
