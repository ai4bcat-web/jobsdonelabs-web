kind = "web"
previewPath = "/"
title = "JobsDone Labs Landing Page"
version = "1.0.0"
id = "artifacts/landing-page"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18083

[services.development]
run = "pnpm --filter @workspace/landing-page run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/landing-page", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["node", "artifacts/landing-page/server.mjs"]

[services.production.run.env]
PORT = "18083"
NODE_ENV = "production"

[services.env]
PORT = "18083"
BASE_PATH = "/"
