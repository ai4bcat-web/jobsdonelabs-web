kind = "web"
previewPath = "/"
title = "JobsDone Labs Landing Page"
version = "1.0.0"
id = "artifacts/landing-page"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18083

[services.development]
run = "pnpm --filter @workspace/landing-page run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/landing-page", "run", "build" ]
publicDir = "artifacts/landing-page/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/blog/"
to = "/blog/index.html"

[[services.production.rewrites]]
from = "/blog/stop-chasing-client-documents/"
to = "/blog/stop-chasing-client-documents/index.html"

[[services.production.rewrites]]
from = "/blog/shopify-quickbooks-reconciliation-never-matches/"
to = "/blog/shopify-quickbooks-reconciliation-never-matches/index.html"

[[services.production.rewrites]]
from = "/blog/trucking-fuel-receipts-expense-tracking-fix/"
to = "/blog/trucking-fuel-receipts-expense-tracking-fix/index.html"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18083"
BASE_PATH = "/"
